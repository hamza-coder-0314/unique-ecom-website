
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Page</title>
    <link rel="stylesheet" href="checkout.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

     <!-- =============header section start================ -->

    <nav>
      <a href="./index.html" class="logo">
        Model Cars
      </a>

      <ul class="nav-links">
          <a href="#Home">Home</a>
        </li>
          <a href="#Service">Service</a>

        <li><a href="./about.html">About</a></li>
        <li><a href="./contact.html">Contact</a></li>
        <li><a href="#Gallery">Gallery</a></li>
      </ul>
      <div class="auth-button">

        <a href="./signup.html" class="nav-button" id="signup">Sign up</a>
        <a href="./login.html" class="nav-button" id="login">Login</a>
        <a href="./index.html" class="nav-button" onclick="logout()" id="logout">Logout</a>
        <a href="./profile.html" class="profile-btn" id="profile"><img src="../img/images.jpg"
            style="border-radius: 50%; border: 3px solid rgb(1, 73, 255);" width="40px" height="40px"></a>
            <span>🛒</span>
      </div>
    </nav>

     <!-- =============header section end================ -->
<main class="checkout">

        <form>
            <div class="form-row">
                <div class="field">
                    <label>First Name*</label>
                    <input type="text" placeholder="First Name">
                </div>

                <div class="field">
                    <label>Last Name*</label>
                    <input type="text" placeholder="Last Name">
                </div>
            </div>

            <div class="form-row">
                <div class="field">
                    <label>Email*</label>
                    <input type="email" placeholder="Email Address">
                </div>

                <div class="field">
                    <label>Phone Number*</label>
                    <input type="tel" placeholder="+92">
                </div>
            </div>

            <div class="form-row">
                <div class="field">
                    <label>Country*</label>
                    <select>
                        <option>Pakistan</option>
                        <option>United States</option>
                        <option>United Kingdom</option>
                    </select>
                </div>

                <div class="field">
                    <label>State*</label>
                    <input type="text" placeholder="State">
                </div>

                <div class="field">
                    <label>Zip Code*</label>
                    <input type="text" placeholder="Zip Code">
                </div>
            </div>

            <div class="field">
                <label>Address*</label>
                <input type="text" placeholder="Enter your address">
            </div>

            <div class="field">
                <label>Description</label>
                <textarea placeholder="Additional information"></textarea>
            </div>

            <h3>Shipping Method</h3>

            <div class="shipping">
                <label class="shipping-option">
                    <input type="radio" name="shipping" checked>
                    <span>
                        <strong>Free Shipping</strong>
                        <small>5-10 Days</small>
                    </span>
                    <b>$0</b>
                </label>

                <label class="shipping-option">
                    <input type="radio" name="shipping">
                    <span>
                        <strong>Express Shipping</strong>
                        <small>1-3 Days</small>
                    </span>
                    <b>$9</b>
                </label>
            </div>
        </form>
    </section>

    <aside class="cart">
        <h2>Your Cart</h2>

        <div class="product">
            <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=100" alt="Watch">
            <div class="product-info">
                <strong>Modern Fashion Watch</strong>
                <small>Black / Medium</small>
            </div>
            <b>$99.00</b>
        </div>

        <div class="product">
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=100" alt="Shoes">
            <div class="product-info">
                <strong>Premium Sneakers</strong>
                <small>Red / Size 42</small>
            </div>
            <b>$120.00</b>
        </div>

        <div class="discount">
            <input type="text" placeholder="Discount code">
            <button>Apply</button>
        </div>

        <div class="summary">
            <p><span>Subtotal</span><b>$219.00</b></p>
            <p><span>Shipping</span><b>$0.00</b></p>
            <p><span>Estimated Tax</span><b>$3.00</b></p>
            <hr>
            <h3><span>Total</span><strong>$222.00</strong></h3>
        </div>

        <button class="checkout-btn" onclick="conform()">Continue to Payment</button>
    </aside>

</main>
<script src="../js/script.js"></script>
<script src="../js/app.js"></script>
</body>
</html>
