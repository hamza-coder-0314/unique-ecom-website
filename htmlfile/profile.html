<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile Form</title>
  <link rel="stylesheet" href="../css/prof.css">
</head>
<body>

  <div class="profile-card">
    <h2>User Profile</h2>
    
    <form>
      
      
      <div class="avatar-upload">
        <label for="imageUpload">
          <img id="imagePreview" src="../img/images.jpg">
        </label>
        <input type="file" id="imageUpload" accept="image/*" hidden>
        <p>Click image to change photo</p>
      </div>

    
      <div class="input-group">
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" placeholder="Enter your full name" required>

        <label for="fullname">last Name</label>
        <input type="text" id="fullname" placeholder="Enter your last name" required>

        <label for="fullname">Email</label>
        <input type="text" id="fullname" placeholder="Enter your Email" required>

        <label for="fullname">password</label>
        <input type="text" id="password" placeholder="Enter your password" required>
      </div>


</body>
</html>
